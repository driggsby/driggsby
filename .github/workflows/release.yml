name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - "driggsby-v*"

jobs:
  verify-release-target:
    runs-on: "ubuntu-22.04"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      # Plain X.Y.Z only: a prerelease suffix would still publish to npm's
      # `latest` dist-tag, which every `npx driggsby@latest` user installs.
      - name: Validate release tag format
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^driggsby-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
      - name: Verify tagged commit is current origin/main
        run: |
          git fetch origin main:refs/remotes/origin/main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
      - name: Verify the tag matches the package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#driggsby-v}"
          package_version="$(node -p 'require("./packages/driggsby/package.json").version')"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag version $tag_version does not match package version $package_version" >&2
            exit 1
          fi

  verify:
    needs:
      - verify-release-target
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint and typecheck
        run: npm run check
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  npm-publish-surface:
    needs:
      - verify-release-target
    runs-on: "ubuntu-22.04"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies and build
        run: |
          npm ci
          npm run build
      - name: Validate the packed npm package against the tag version
        shell: bash
        run: |
          node scripts/release/check-npm-publish-surface.ts "${GITHUB_REF_NAME#driggsby-v}"

  publish-npm:
    needs:
      - verify-release-target
      - verify
      - npm-publish-surface
    runs-on: "ubuntu-22.04"
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24"
          cache: npm
          registry-url: "https://registry.npmjs.org"
      # This job holds the OIDC publish credential, so nothing in it may run
      # package-defined hooks: dependencies install with --ignore-scripts, and
      # the surface check re-validates THIS job's build — the exact bytes the
      # publish step packs — rather than trusting a different runner's tarball.
      - name: Install dependencies and build
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Validate the npm package this job will publish
        shell: bash
        run: |
          node scripts/release/check-npm-publish-surface.ts "${GITHUB_REF_NAME#driggsby-v}"
      # The libraries publish first: driggsby pins @driggsby/deploy and
      # @driggsby/sdk at the exact lockstep version, so each dependency must
      # exist on the registry before the CLI that requires it does. Each
      # publish is skipped when that exact version is already on the
      # registry, so a re-run of a release that failed between publishes
      # completes instead of dying on the version conflict. npm takes a few
      # minutes to make a fresh publish visible, so a re-run inside that
      # window can miss it on the check and then be refused with "Cannot
      # publish over previously published/staged version"; that refusal only
      # ever means this exact version already went out, so it counts as done.
      # Note: npm trusted publishing is configured per package on npmjs.com,
      # so each package needs its trusted publisher set up there before the
      # first release that includes it.
      - name: Publish npm packages
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#driggsby-v}"
          for package in "@driggsby/deploy" "@driggsby/sdk" "driggsby"; do
            if npm view "${package}@${version}" version > /dev/null 2>&1; then
              echo "${package}@${version} is already on the registry; skipping its publish."
              continue
            fi
            if ! output="$(npm publish --workspace "$package" --access public --provenance --ignore-scripts 2>&1)"; then
              echo "$output"
              if grep -q "Cannot publish over previously" <<< "$output"; then
                echo "${package}@${version} was already published and npm is still processing it; treating it as done."
                continue
              fi
              exit 1
            fi
            echo "$output"
          done

  # The release's public record on GitHub: which npm packages went out and
  # what changed since the previous release. It runs only after every
  # package published, so it never announces a version npm doesn't have,
  # and a re-run finds the release already there and stops.
  github-release:
    needs:
      - publish-npm
    runs-on: "ubuntu-22.04"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "The GitHub Release for ${GITHUB_REF_NAME} already exists."
            exit 0
          fi
          version="${GITHUB_REF_NAME#driggsby-v}"
          previous="$(git describe --tags --abbrev=0 --match 'driggsby-v*' "${GITHUB_REF_NAME}^")"
          notes="Published to npm: [driggsby@${version}](https://www.npmjs.com/package/driggsby/v/${version}), [@driggsby/deploy@${version}](https://www.npmjs.com/package/@driggsby/deploy/v/${version}), [@driggsby/sdk@${version}](https://www.npmjs.com/package/@driggsby/sdk/v/${version})."
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "$notes" --generate-notes --notes-start-tag "$previous" --latest
