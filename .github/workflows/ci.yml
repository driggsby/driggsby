name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: npm run check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check source file lengths
        shell: bash
        run: bash scripts/check_source_line_lengths.sh

  node-floor-smoke:
    name: built CLI runs on Node 18
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Node.js 24 (build)
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Set up Node.js 18 (run)
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "18"

      - name: Smoke the built CLI on the engines floor
        run: |
          node --version
          node packages/driggsby/bin/driggsby.js --version
          node packages/driggsby/bin/driggsby.js mcp setup claude-code --print
          node packages/driggsby/bin/driggsby.js mcp setup other

  npm-publish-surface:
    name: npm publish surface
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Validate the packed npm package
        run: node scripts/release/check-npm-publish-surface.ts
