name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - "driggsby-v*"

jobs:
  verify-release-target:
    runs-on: "ubuntu-22.04"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Validate release tag format
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^driggsby-v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
      - name: Verify tagged commit is current origin/main
        run: |
          git fetch origin main:refs/remotes/origin/main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
      - name: Verify the tag matches the package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#driggsby-v}"
          package_version="$(node -p 'require("./packages/driggsby/package.json").version')"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag version $tag_version does not match package version $package_version" >&2
            exit 1
          fi

  verify:
    needs:
      - verify-release-target
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint and typecheck
        run: npm run check
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  npm-publish-surface:
    needs:
      - verify-release-target
    runs-on: "ubuntu-22.04"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies and build
        run: |
          npm ci
          npm run build
      - name: Validate the packed npm package against the tag version
        shell: bash
        run: |
          node scripts/release/check-npm-publish-surface.ts "${GITHUB_REF_NAME#driggsby-v}"

  publish-npm:
    needs:
      - verify-release-target
      - verify
      - npm-publish-surface
    runs-on: "ubuntu-22.04"
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24"
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies and build
        run: |
          npm ci
          npm run build
      - name: Publish npm package
        run: npm publish --workspace driggsby --access public --provenance
