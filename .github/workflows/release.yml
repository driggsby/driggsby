name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - "driggsby-v*"

jobs:
  verify-release-target:
    runs-on: "ubuntu-22.04"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      # Plain X.Y.Z only: a prerelease suffix would still publish to npm's
      # `latest` dist-tag, which every `npx driggsby@latest` user installs.
      - name: Validate release tag format
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^driggsby-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
      - name: Verify tagged commit is current origin/main
        run: |
          git fetch origin main:refs/remotes/origin/main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
      - name: Verify the tag matches the package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#driggsby-v}"
          package_version="$(node -p 'require("./packages/driggsby/package.json").version')"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag version $tag_version does not match package version $package_version" >&2
            exit 1
          fi

  verify:
    needs:
      - verify-release-target
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint and typecheck
        run: npm run check
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  npm-publish-surface:
    needs:
      - verify-release-target
    runs-on: "ubuntu-22.04"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies and build
        run: |
          npm ci
          npm run build
      - name: Validate the packed npm package against the tag version
        shell: bash
        run: |
          node scripts/release/check-npm-publish-surface.ts "${GITHUB_REF_NAME#driggsby-v}"

  publish-npm:
    needs:
      - verify-release-target
      - verify
      - npm-publish-surface
    runs-on: "ubuntu-22.04"
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24"
          cache: npm
          registry-url: "https://registry.npmjs.org"
      # This job holds the OIDC publish credential, so nothing in it may run
      # package-defined hooks: dependencies install with --ignore-scripts, and
      # the surface check re-validates THIS job's build — the exact bytes the
      # publish step packs — rather than trusting a different runner's tarball.
      - name: Install dependencies and build
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Validate the npm package this job will publish
        shell: bash
        run: |
          node scripts/release/check-npm-publish-surface.ts "${GITHUB_REF_NAME#driggsby-v}"
      # The libraries publish first: driggsby pins @driggsby/deploy and
      # @driggsby/sdk at the exact lockstep version, so each dependency must
      # exist on the registry before the CLI that requires it does. Each
      # publish is skipped when that exact version is already on the
      # registry from this tag's commit (npm records it as gitHead), so a
      # re-run of a release that failed between publishes completes instead
      # of dying on the version conflict. A version already published from
      # any other commit (a re-pushed tag, a manual publish) fails the
      # release instead: skipping it would mix commits across packages that
      # pin each other exactly. Bump the version. npm takes a few
      # minutes to serve a fresh publish, so a re-run inside that window can
      # miss it here and be refused with "Cannot publish over previously
      # staged version". That refusal is deliberately NOT treated as done:
      # npm uses it for versions that never went live (a held stage, an npm
      # bug), and publishing the CLI on top of one would ship an exact pin
      # nobody can install. Wait a few minutes and re-run. Note: npm trusted
      # publishing is configured per package on npmjs.com, so each package
      # needs its trusted publisher set up there before the first release
      # that includes it.
      - name: Publish npm packages
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#driggsby-v}"
          for package in "@driggsby/deploy" "@driggsby/sdk" "driggsby"; do
            if npm view "${package}@${version}" version > /dev/null 2>&1; then
              published_from="$(npm view "${package}@${version}" gitHead)"
              if [[ "$published_from" != "$GITHUB_SHA" ]]; then
                echo "${package}@${version} is already on the registry, built from a different commit; release a new version instead." >&2
                exit 1
              fi
              echo "${package}@${version} is already on the registry from this commit; skipping its publish."
              continue
            fi
            npm publish --workspace "$package" --access public --provenance --ignore-scripts
          done

  # The release's public record on GitHub: the npm packages it published and
  # the changes since the previous shipped release. It runs only after every
  # package published, waits until npm's registry serves all three (npm
  # takes a few minutes to process a publish), and fails rather than
  # announce a version nobody can install or one npm built from a different
  # commit. It is marked Latest unless a newer tag already has a release,
  # and a re-run finds the release already there and stops.
  github-release:
    needs:
      - publish-npm
    runs-on: "ubuntu-22.04"
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Wait until npm serves every package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#driggsby-v}"
          deadline=$((SECONDS + 1200))
          for package in "@driggsby/deploy" "@driggsby/sdk" "driggsby"; do
            url="https://registry.npmjs.org/${package/\//%2f}/${version}"
            until body="$(curl -fsS --max-time 20 "$url")"; do
              if (( SECONDS >= deadline )); then
                echo "${package}@${version} is still not served by npm after 20 minutes; not announcing the release." >&2
                exit 1
              fi
              sleep 30
            done
            published_from="$(jq -r '.gitHead // ""' <<<"$body")"
            if [[ "$published_from" != "$GITHUB_SHA" ]]; then
              echo "${package}@${version} on npm was built from a different commit; not announcing the release." >&2
              exit 1
            fi
            echo "${package}@${version} is live on npm, built from this commit."
          done
      - name: Create the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Every published release's tag, in one call: an API error fails the
          # job rather than skip a release or pick the wrong previous one.
          releases="$(gh release list --exclude-drafts --limit 1000 --json tagName --jq '.[].tagName')"
          if grep -qxF "$GITHUB_REF_NAME" <<<"$releases"; then
            echo "The GitHub Release for ${GITHUB_REF_NAME} already exists."
            exit 0
          fi
          # The tag must still point at the commit this run built and
          # published: read it from GitHub again, not the job-start copy.
          git fetch --quiet --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          test "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")" = "$GITHUB_SHA"
          version="${GITHUB_REF_NAME#driggsby-v}"
          # The changes start at the previous tag that became a release, so a
          # tag whose publish failed never hides its changes from the notes.
          previous=""
          for tag in $(git tag --merged "${GITHUB_SHA}^" -l 'driggsby-v*' --sort=-v:refname); do
            if grep -qxF "$tag" <<<"$releases"; then
              previous="$tag"
              break
            fi
          done
          # Latest unless a newer tag already has a release: a stray tag (a
          # typo, a release that failed) never takes the badge.
          latest=true
          for tag in $(git tag -l 'driggsby-v*' --sort=-v:refname); do
            if [[ "$tag" == "$GITHUB_REF_NAME" ]]; then
              break
            fi
            if grep -qxF "$tag" <<<"$releases"; then
              latest=false
              break
            fi
          done
          notes="Published to npm: [driggsby@${version}](https://www.npmjs.com/package/driggsby/v/${version}), [@driggsby/deploy@${version}](https://www.npmjs.com/package/@driggsby/deploy/v/${version}), [@driggsby/sdk@${version}](https://www.npmjs.com/package/@driggsby/sdk/v/${version})."
          start_args=()
          if [[ -n "$previous" ]]; then
            start_args=(--notes-start-tag "$previous")
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "${notes}"$'\n' --generate-notes "${start_args[@]}" --latest="$latest"
