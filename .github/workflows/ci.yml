name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: npm run check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check source file lengths
        shell: bash
        run: bash scripts/check_source_line_lengths.sh

  node-floor-smoke:
    name: built CLI runs on Node 18
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Node.js 24 (build)
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Set up Node.js 18 (run)
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "18"

      - name: Smoke the built CLI on the engines floor
        run: |
          node --version
          node packages/driggsby/bin/driggsby.js --version
          node packages/driggsby/bin/driggsby.js mcp setup claude-code --print
          node packages/driggsby/bin/driggsby.js mcp setup other

      # The standalone deploy bin with no token must load cleanly on Node 18
      # and refuse with the message naming DRIGGSBY_TOKEN (exit 1 by design).
      # env -i pins the bin to an empty environment (PATH only), matching the
      # publish-surface check: an ambient DRIGGSBY_TOKEN could otherwise turn
      # this smoke into a real authenticated request.
      - name: Smoke the built deploy bin on the engines floor
        run: |
          if env -i PATH="$PATH" node packages/deploy/bin/driggsby-deploy.js 2> deploy-smoke-stderr.txt; then
            echo "driggsby-deploy without a token must fail" >&2
            exit 1
          fi
          grep -q DRIGGSBY_TOKEN deploy-smoke-stderr.txt

      # The token check exits the bin before any real work, so this exercises
      # the library's actual deploy work (directory walk, stream hashing) on
      # the Node 18 floor too, against a throwaway fixture directory.
      - name: Exercise the built deploy library on the engines floor
        run: |
          mkdir -p /tmp/deploy-floor-smoke/assets
          printf '<h1>hi</h1>' > /tmp/deploy-floor-smoke/index.html
          printf 'body {}' > /tmp/deploy-floor-smoke/assets/app.css
          node --input-type=module -e "
            const { collectDeployFiles } = await import('./packages/deploy/dist/manifest.js');
            const collected = await collectDeployFiles('/tmp/deploy-floor-smoke');
            const paths = collected.files.map((file) => file.path).join(',');
            if (paths !== 'assets/app.css,index.html') {
              throw new Error('unexpected manifest: ' + paths);
            }
            if (!/^[0-9a-f]{64}\$/.test(collected.files[0].sha256)) {
              throw new Error('missing sha256');
            }
            console.log('deploy library manifest + hashing OK on ' + process.version);
          "

  npm-publish-surface:
    name: npm publish surface
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Validate the packed npm package
        run: node scripts/release/check-npm-publish-surface.ts
