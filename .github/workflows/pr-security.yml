name: PR Security

env:
  ACTIONLINT_VERSION: "1.7.12"

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "Justfile"
      - "LICENSE"
      - "README.md"
      - "eslint.config.mjs"
      - "package-lock.json"
      - "package.json"
      - "packages/**"
      - "scripts/**"
      - "tsconfig.base.json"
      - "tsconfig.json"

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  release-surface-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25.1"
          cache: false

      - name: Restore actionlint Go cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/go/bin/actionlint
            ~/go/pkg/mod
            ~/.cache/go-build
          key: actionlint-${{ runner.os }}-${{ env.ACTIONLINT_VERSION }}

      - name: Install actionlint
        run: |
          actionlint_bin="$(go env GOPATH)/bin/actionlint"
          if [ ! -x "$actionlint_bin" ]; then
            go install "github.com/rhysd/actionlint/cmd/actionlint@v${ACTIONLINT_VERSION}"
          fi
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate workflow semantics
        run: actionlint .github/workflows/*.yml

      - name: Validate workflow YAML
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].sort.each { |f| YAML.load_file(f) }'

      - name: Verify pinned GitHub Actions
        run: bash scripts/check_github_action_pins.sh
